<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 0.6s ease-in-out;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        h3 {
            color: #666;
            margin-bottom: 15px;
            font-weight: 500;
        }

        p {
            color: #555;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            resize: none;
            font-size: 14px;
            transition: 0.3s;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .summary-output {
            margin-top: 25px;
            text-align: left;
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
        }

        #summary-text {
            margin-top: 10px;
            color: #333;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>Using HuggingFace Transformer</h3>
        <p>Write or Paste your content below for quick summarization</p>

        <form id="summarization-form">
            <textarea name="" id="dialogue-input"></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div class="summary-output">
            <h3 id="summary-healing" placeholder="Enter your content here ...." required>Content Summary</h3>
            <p id="summary-text"></p>
        </div>

    </div>
</body>

<script>
    document.getElementById("summarization-form").addEventListener("submit",async(e) =>{
        e.preventDefault();

        const dialogueInput = document.getElementById("dialogue-input");
        const summaryText = document.getElementById("summary-text");
        const submitButton = e.target.querySelector("button");

        const dialogue = dialogueInput.value.trim();
        if(!dialogue) return;
        summaryText.innerText="Processing...";
        submitButton.disabled=true;
         try{

            const response = await fetch("/summarize",{
                method : "POST",
                headers:{"Content-Type": "application/json"},
                body:JSON.stringify({dialogue}),
            });
             
            if(!response.ok){
                throw new Error(`Server error: ${response.status}`);
            }

            const data= await response.json();
            summaryText.innerText=data.summary || "No Summary returned";

         }catch(err){
            summaryText.innerText =`Error:${err.message}`;
         }
         finally{
            submitButton.disabled=false;
         }
        });
</script>

</html>
